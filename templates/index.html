<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lumina AI</title>
    <!-- Đã sửa lại icon chuẩn an toàn, không bị lỗi font -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%231e88e5'/%3E%3Cpath d='M55 15 L30 55 L48 55 L42 85 L72 42 L52 42 Z' fill='white'/%3E%3C/svg%3E" />
    
    <style>
        :root { --bg-body: #f5f7fb; --bg-sidebar: #ffffff; --bg-chat: #f5f7fb; --bg-msg-bot: #ffffff; --bg-model-bar: #ffffff; --bg-input: #ffffff; --bg-recent-item: #f9f9f9; --bg-recent-hover: #e3f2fd; --text-main: #333333; --text-muted: #666666; --border-color: #e0e6f0; --primary: #1e88e5; --primary-dark: #1565c0; --msg-user-bg: #1e88e5; --msg-user-text: #ffffff; --code-bg: #f0f0f0; --pre-bg: #282c34; --pre-text: #abb2bf; --modal-bg: rgba(0,0,0,0.5); }
        body.dark-mode { --bg-body: #121212; --bg-sidebar: #1e1e1e; --bg-chat: #121212; --bg-msg-bot: #1e1e1e; --bg-model-bar: #1e1e1e; --bg-input: #1e1e1e; --bg-recent-item: #2a2a2a; --bg-recent-hover: #333333; --text-main: #e0e0e0; --text-muted: #aaaaaa; --border-color: #333333; --primary: #2196f3; --primary-dark: #1976d2; --msg-user-bg: #1976d2; --code-bg: #2a2a2a; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; transition: background-color 0.3s, color 0.3s; }
        body { display: flex; height: 100vh; background: var(--bg-body); color: var(--text-main); overflow: hidden; }
        
        /* SIDEBAR */
        .sidebar { width: 280px; background: var(--bg-sidebar); border-right: 1px solid var(--border-color); display: flex; flex-direction: column; }
        .sidebar-header { padding: 20px; background: var(--primary); color: white; font-weight: bold; font-size: 18px; display: flex; justify-content: space-between; align-items: center; }
        .user-badge { font-size: 12px; background: {{ 'gold' if is_pro else '#fff' }}; color: {{ '#333' if is_pro else '#1e88e5' }}; padding: 2px 6px; border-radius: 4px; font-weight: bold; }
        .new-chat-btn { margin: 15px; padding: 12px; background: var(--primary); color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; display: flex; align-items: center; justify-content: center; gap: 8px; transition: 0.2s; }
        .new-chat-btn:hover { background: var(--primary-dark); }
        .recent-tab { flex: 1; overflow-y: auto; padding: 0 15px 15px 15px; }
        .recent-title { font-size: 12px; color: var(--text-muted); text-transform: uppercase; margin-bottom: 10px; font-weight: bold; margin-left: 5px; }
        .recent-item { padding: 10px; background: var(--bg-recent-item); border-radius: 8px; margin-bottom: 10px; cursor: pointer; border: 1px solid transparent; transition: 0.2s; }
        .recent-item:hover { border-color: var(--primary); background: var(--bg-recent-hover); }
        .recent-q { font-weight: bold; font-size: 14px; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text-main); }
        .recent-a { font-size: 12px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .sidebar-footer { padding: 15px; border-top: 1px solid var(--border-color); display: flex; flex-direction: column; gap: 10px; }
        .btn-sidebar { padding: 10px; text-align: center; background: var(--bg-recent-item); border-radius: 8px; text-decoration: none; color: var(--text-main); font-size: 14px; border: 1px solid transparent; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .btn-sidebar:hover { border-color: var(--primary); }
        .btn-sidebar.logout { color: #c62828; }
        body.dark-mode .btn-sidebar.logout { color: #ef5350; background: #331111; }
        
        /* MODAL SETTINGS */
        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: var(--modal-bg); display: none; justify-content: center; align-items: center; z-index: 1000; backdrop-filter: blur(2px); }
        .modal-overlay.active { display: flex; }
        .modal-content { background: var(--bg-sidebar); padding: 25px; border-radius: 12px; width: 320px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); border: 1px solid var(--border-color); }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; font-weight: bold; font-size: 18px; }
        .close-btn { cursor: pointer; font-size: 20px; color: var(--text-muted); }
        .close-btn:hover { color: red; }
        .setting-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--border-color); }
        .switch { position: relative; display: inline-block; width: 34px; height: 20px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .4s; border-radius: 34px; }
        .slider:before { position: absolute; content: ""; height: 14px; width: 14px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--primary); }
        input:checked + .slider:before { transform: translateX(14px); }
        .btn-upgrade-modal { display: block; text-align: center; background: linear-gradient(45deg, #ff8f00, #ffb300); color: white; font-weight: bold; padding: 10px; border-radius: 8px; text-decoration: none; margin-top: 15px; }
        
        /* MAIN CHAT */
        .main-chat { flex: 1; display: flex; flex-direction: column; background: var(--bg-chat); }
        .model-bar { padding: 10px 20px; background: var(--bg-model-bar); border-bottom: 1px solid var(--border-color); display: flex; align-items: center; justify-content: space-between; }
        .model-select-wrap { display: flex; align-items: center; gap: 10px; }
        .model-bar select { padding: 8px 12px; border-radius: 8px; border: 1px solid var(--border-color); font-size: 14px; outline: none; cursor: pointer; width: 300px; background: var(--bg-body); color: var(--text-main); }
        .quota-info { font-size: 12px; color: var(--text-muted); background: var(--bg-recent-item); padding: 4px 10px; border-radius: 20px; }
        .chat-box { flex: 1; padding: 24px; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; }
        .msg { max-width: 80%; padding: 14px 18px; border-radius: 16px; line-height: 1.6; font-size: 15px; }
        .msg.user { align-self: flex-end; background: var(--msg-user-bg); color: var(--msg-user-text); border-bottom-right-radius: 4px; }
        .msg.bot { align-self: flex-start; background: var(--bg-msg-bot); color: var(--text-main); border: 1px solid var(--border-color); border-bottom-left-radius: 4px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        
        /* MARKDOWN CSS */
        .msg.bot p { margin-bottom: 8px; }
        .msg.bot pre { background: var(--pre-bg); color: var(--pre-text); padding: 10px; border-radius: 8px; overflow-x: auto; margin: 10px 0; }
        .msg.bot code { font-family: monospace; background: var(--code-bg); padding: 2px 4px; border-radius: 4px; color: var(--text-main); }
        .msg.bot pre code { background: transparent; padding: 0; color: inherit; }
        
        .input-bar { padding: 20px; background: var(--bg-input); border-top: 1px solid var(--border-color); display: flex; gap: 10px; }
        .input-bar input { flex: 1; padding: 15px; border: 1px solid var(--border-color); border-radius: 25px; outline: none; font-size: 15px; background: var(--bg-body); color: var(--text-main); }
        .input-bar button { width: 50px; height: 50px; border-radius: 50%; border: none; background: var(--primary); color: white; font-size: 20px; cursor: pointer; }
        .input-bar button:disabled { background: #888; cursor: not-allowed; }
    </style>
</head>
<body>

    <!-- SIDEBAR -->
    <div class="sidebar">
        <div class="sidebar-header"><span>⚡ Lumina</span><span class="user-badge">{{ 'PRO' if is_pro else 'LITE' }}</span></div>
        <button class="new-chat-btn" onclick="createNewChat()">➕ Cuộc trò chuyện mới</button>
        <div class="recent-tab" id="recentList"><div class="recent-title">Gần đây</div></div>
        <div class="sidebar-footer">
            <div style="text-align: center; font-size: 13px; color: var(--text-muted); margin-bottom: 5px;">👤 {{ username }}</div>
            <div class="btn-sidebar" onclick="toggleSettings()">⚙️ Cài đặt</div>
            <a href="/logout" class="btn-sidebar logout">Đăng xuất</a>
        </div>
    </div>

    <!-- MODAL SETTINGS -->
    <div class="modal-overlay" id="settingsModal">
        <div class="modal-content">
            <div class="modal-header"><span>⚙️ Cài đặt</span><span class="close-btn" onclick="toggleSettings()">✖</span></div>
            <div class="setting-item"><span>🌙 Giao diện tối</span><label class="switch"><input type="checkbox" id="darkModeToggle"><span class="slider"></span></label></div>
            {% if not is_pro %}<a href="/upgrade" class="btn-upgrade-modal">🚀 Nâng cấp Lumina Pro</a>{% else %}<div style="text-align: center; font-size: 13px; color: gold; margin-top: 15px;">⭐ Bạn đang dùng bản Pro</div>{% endif %}
        </div>
    </div>

    <!-- CHAT AREA -->
    <div class="main-chat">
        <div class="model-bar">
            <div class="model-select-wrap">
                <label for="modelSelect" style="font-weight: bold; color: var(--text-muted);">🧠 Model:</label>
                <select id="modelSelect">
                    {% for m in models %}<option value="{{ m.id }}" {% if m.is_pro and not is_pro %}disabled>🔒 {{ m.name }} (Cần Pro){% else %}>{{ m.name }}{% endif %}</option>{% endfor %}
                </select>
            </div>
            <div class="quota-info">Giới hạn: <b>{{ '70' if is_pro else '30' }}</b> tin/ngày</div>
        </div>
        <div class="chat-box" id="chatBox"></div>
        <form class="input-bar" id="chatForm">
            <input type="text" id="msgInput" placeholder="Nhập tin nhắn..." autocomplete="off">
            <button type="submit" id="sendBtn">➤</button>
        </form>
    </div>

    <!-- TOÀN BỘ JAVASCRIPT -->
    <script>
        const chatBox = document.getElementById('chatBox');
        const form = document.getElementById('chatForm');
        const input = document.getElementById('msgInput');
        const sendBtn = document.getElementById('sendBtn');
        const recentList = document.getElementById('recentList');
        const modelSelect = document.getElementById('modelSelect');
        const darkModeToggle = document.getElementById('darkModeToggle');
        const settingsModal = document.getElementById('settingsModal');
        const username = "{{ username }}";
        
        let chatSessions = []; 
        let currentSessionId = null; 

        function createNewChat() {
            const newSession = { id: Date.now().toString(), title: "Đoạn chat mới", messages: [] };
            chatSessions.unshift(newSession); currentSessionId = newSession.id;
            renderRecentList(); renderChatBox(); input.focus();
        }

        function loadChatSession(id) { currentSessionId = id; renderChatBox(); renderRecentList(); }

        function renderRecentList() {
            recentList.querySelectorAll('.recent-item').forEach(i => i.remove());
            chatSessions.forEach(session => {
                const div = document.createElement('div'); div.className = 'recent-item';
                if(session.id === currentSessionId) { div.style.borderColor = 'var(--primary)'; div.style.background = 'var(--bg-recent-hover)'; }
                let displayTitle = session.title; let displaySub = "Chưa có tin nhắn";
                if(session.messages.length > 0) {
                    const firstUserMsg = session.messages.find(m => m.role === 'user');
                    if (firstUserMsg) displayTitle = firstUserMsg.text.substring(0, 25) + (firstUserMsg.text.length > 25 ? '...' : '');
                    displaySub = session.messages[session.messages.length - 1].text.substring(0, 35) + '...';
                }
                div.innerHTML = `<div class="recent-q">${displayTitle}</div><div class="recent-a">${displaySub}</div>`;
                div.onclick = () => loadChatSession(session.id);
                recentList.querySelector('.recent-title').insertAdjacentElement('afterend', div);
            });
        }

        function renderChatBox() {
            chatBox.innerHTML = '';
            const session = chatSessions.find(s => s.id === currentSessionId);
            if (!session || session.messages.length === 0) {
                chatBox.innerHTML = `<div class="msg bot">Xin chào <b>${username}</b>! Tôi là Lumina AI. Hãy chọn model ở thanh bên trên và bắt đầu trò chuyện nhé.</div>`;
                return;
            }
            session.messages.forEach(msg => {
                const div = document.createElement('div'); div.className = `msg ${msg.role}`; div.innerHTML = msg.html;
                chatBox.appendChild(div);
            });
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        if (localStorage.getItem('lumina_dark_mode') === 'true') { document.body.classList.add('dark-mode'); darkModeToggle.checked = true; }
        darkModeToggle.addEventListener('change', (e) => {
            if (e.target.checked) { document.body.classList.add('dark-mode'); localStorage.setItem('lumina_dark_mode', 'true'); }
            else { document.body.classList.remove('dark-mode'); localStorage.setItem('lumina_dark_mode', 'false'); }
        });
        
        function toggleSettings() { settingsModal.classList.toggle('active'); }
        settingsModal.addEventListener('click', (e) => { if(e.target === settingsModal) toggleSettings(); });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const text = input.value.trim(); if(!text) return;
            if (!currentSessionId) createNewChat();
            const session = chatSessions.find(s => s.id === currentSessionId);
            const selectedModelId = modelSelect.value;
            
            session.messages.push({ role: 'user', text: text, html: text });
            input.value = ''; renderChatBox();

            const typingDiv = document.createElement('div'); typingDiv.className = 'msg bot'; typingDiv.textContent = 'Đang suy nghĩ...';
            chatBox.appendChild(typingDiv); chatBox.scrollTop = chatBox.scrollHeight;

            try {
                const res = await fetch('/api/chat', {
                    method: 'POST', headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ message: text, model_id: selectedModelId })
                });
                const data = await res.json();
                typingDiv.remove(); 

                if(data.error) {
                    const errorHtml = `<span style="color:#ef5350;">⚠️ ${data.error}</span>`;
                    session.messages.push({ role: 'bot', text: data.error, html: errorHtml });
                    renderChatBox(); renderRecentList();
                    if(data.error.includes("giới hạn")) { input.disabled = true; sendBtn.disabled = true; input.placeholder = "Đã đạt giới hạn, vui lòng quay lại ngày mai!"; }
                } else {
                    session.messages.push({ role: 'bot', text: typingDiv.innerText, html: data.reply_html });
                    renderChatBox(); renderRecentList();
                }
            } catch (err) {
                typingDiv.remove();
                const errorHtml = `<span style="color:#ef5350;">⚠️ Lỗi kết nối server</span>`;
                session.messages.push({ role: 'bot', text: "Lỗi kết nối server", html: errorHtml });
                renderChatBox(); renderRecentList();
            }
        });

        // Khởi tạo
        createNewChat();
    </script>
</body>
</html>
