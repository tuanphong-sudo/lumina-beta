<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Đăng nhập - Lumina AI</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%231e88e5'/%3E%3Cpath d='M55 15 L30 55 L48 55 L42 85 L72 42 L52 42 Z' fill='white'/%3E%3C/svg%3E" />
    <style>
        * { box-sizing: border-box; }
        body { background: #f5f7fb; display: flex; justify-content: center; align-items: center; height: 100vh; height: 100dvh; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 15px; overflow: hidden; }
        .box { background: white; padding: 36px 30px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 100%; max-width: 340px; text-align: center; }
        h2 { color: #1e88e5; margin: 0 0 20px 0; }
        input[type="text"], input[type="password"] { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 8px; font-size: 16px; outline: none; }
        input:focus { border-color: #1e88e5; }
        .remember-row { display: flex; align-items: center; justify-content: flex-start; gap: 6px; margin: 6px 0 12px 0; font-size: 13px; color: #555; }
        button { width: 100%; padding: 12px; background: #1e88e5; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 15px; }
        button:hover { background: #1565c0; }
        .toggle { margin-top: 15px; font-size: 14px; color: #666; cursor: pointer; }
        .toggle:hover { color: #1e88e5; }
    </style>
</head>
<body>
    <div class="box">
        <h2 id="title">Đăng Nhập</h2>
        <input type="text" id="username" placeholder="Tên đăng nhập" autocomplete="username">
        <input type="password" id="password" placeholder="Mật khẩu" autocomplete="current-password" onkeydown="if(event.key==='Enter') submitForm()">
        <label class="remember-row">
            <input type="checkbox" id="rememberMe" checked> Tự động giữ đăng nhập
        </label>
        <button onclick="submitForm()" id="btn">Đăng Nhập</button>
        <div class="toggle" onclick="toggleMode()" id="toggleText">Chưa có tài khoản? Đăng ký</div>
    </div>

    <script>
        let isLogin = true;
        const savedUser = localStorage.getItem('lumina_saved_username');
        if (savedUser) document.getElementById('username').value = savedUser;
        
        function toggleMode() {
            isLogin = !isLogin;
            document.getElementById('title').innerText = isLogin ? "Đăng Nhập" : "Đăng Ký";
            document.getElementById('btn').innerText = isLogin ? "Đăng Nhập" : "Tạo Tài Khoản";
            document.getElementById('toggleText').innerText = isLogin ? "Chưa có tài khoản? Đăng ký" : "Đã có tài khoản? Đăng nhập";
        }

        async function submitForm() {
            const u = document.getElementById('username').value.trim();
            const p = document.getElementById('password').value;
            if(!u || !p) return alert("Vui lòng nhập đủ thông tin!");

            const res = await fetch('/login', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ action: isLogin ? 'login' : 'register', username: u, password: p })
            });
            const data = await res.json();
            
            if(data.success) {
                if (document.getElementById('rememberMe').checked) {
                    localStorage.setItem('lumina_saved_username', u);
                }
                if(isLogin) window.location.href = '/';
                else { alert(data.message); toggleMode(); }
            } else {
                alert(data.message);
            }
        }
    </script>
</body>
</html>
