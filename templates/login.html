<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Đăng nhập - Lumina AI</title>
    <style>
        body { background: #f5f7fb; display: flex; justify-content: center; align-items: center; height: 100vh; font-family: sans-serif; margin: 0; }
        .box { background: white; padding: 40px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 320px; text-align: center; }
        h2 { color: #1e88e5; margin-bottom: 20px; }
        input { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #1e88e5; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; margin-top: 10px; }
        button:hover { background: #1565c0; }
        .toggle { margin-top: 15px; font-size: 14px; color: #666; cursor: pointer; }
        .toggle:hover { color: #1e88e5; }
    </style>
</head>
<body>
    <div class="box">
        <h2 id="title">Đăng Nhập</h2>
        <input type="text" id="username" placeholder="Tên đăng nhập">
        <input type="password" id="password" placeholder="Mật khẩu">
        <button onclick="submitForm()" id="btn">Đăng Nhập</button>
        <div class="toggle" onclick="toggleMode()" id="toggleText">Chưa có tài khoản? Đăng ký</div>
    </div>

    <script>
        let isLogin = true;
        
        function toggleMode() {
            isLogin = !isLogin;
            document.getElementById('title').innerText = isLogin ? "Đăng Nhập" : "Đăng Ký";
            document.getElementById('btn').innerText = isLogin ? "Đăng Nhập" : "Tạo Tài Khoản";
            document.getElementById('toggleText').innerText = isLogin ? "Chưa có tài khoản? Đăng ký" : "Đã có tài khoản? Đăng nhập";
        }

        async function submitForm() {
            const u = document.getElementById('username').value;
            const p = document.getElementById('password').value;
            if(!u || !p) return alert("Vui lòng nhập đủ thông tin!");

            const res = await fetch('/login', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ action: isLogin ? 'login' : 'register', username: u, password: p })
            });
            const data = await res.json();
            
            if(data.success) {
                if(isLogin) window.location.href = '/';
                else { alert(data.message); toggleMode(); }
            } else {
                alert(data.message);
            }
        }
    </script>
</body>
</html>
